<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="File-backed board and quick-capture task tracker. Offline, no accounts, no server.">
<meta name="color-scheme" content="light dark">
<title>DOCKET</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#090909">

<meta property="og:type" content="website">
<meta property="og:title" content="Docket">
<meta property="og:description" content="A task board that keeps its own file. Offline, no accounts, no server.">
<meta property="og:url" content="https://talon270.github.io/docket/">
<meta property="og:image" content="https://talon270.github.io/docket/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The word DOCKET in heavy type over a dark blueprint grid, above the labels To do, In progress and Done.">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
</head>
<body>
<noscript>
  <div style="padding:2rem;font-family:monospace">
    [ DOCKET REQUIRES JAVASCRIPT — NONE OF THIS RUNS WITHOUT IT ]
  </div>
</noscript>

<a href="#quick-add-input" class="skip-link">Skip to quick add</a>

<div class="scanlines"></div>

<div class="app-shell">

  <header class="topbar">
    <h1 class="logo">Docket</h1>

    <div class="telemetry" id="telemetry">
      <span class="telemetry-item">ACTIVE <b id="tm-active">0</b></span>
      <span class="telemetry-item">DONE <b id="tm-done">0</b></span>
      <span class="telemetry-item">ARCHIVED <b id="tm-archived">0</b></span>
      <span class="telemetry-rule"></span>
      <span class="telemetry-item" id="tm-date">—</span>
    </div>

    <div class="view-switch">
      <button id="view-board-btn" class="active">Board</button>
      <button id="view-agenda-btn">Agenda</button>
      <button id="view-archive-btn">Archive</button>
    </div>

    <div class="data-controls">
      <button id="export-btn" title="Download a copy of everything as JSON">Export</button>
      <button id="import-btn" title="Load a previously exported JSON file">Import</button>
      <input type="file" id="import-file-input" accept="application/json,.json" hidden>
    </div>

    <button id="theme-toggle" aria-label="Switch between light and dark">
      <span class="theme-dot"></span><span id="theme-label">Dark</span>
    </button>

    <button id="guide-btn" class="guide-btn" title="Take a guided tour of Docket">
      <span class="guide-mark">?</span>Guide
    </button>
  </header>

  <div class="project-bar-wrap">
    <nav class="project-bar">
      <div id="project-tabs" style="display:flex"></div>

      <div class="search-box">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input type="search" id="search-input" placeholder="SEARCH TITLES AND NOTES" autocomplete="off" aria-label="Search tasks">
        <span class="search-count" id="search-count" hidden></span>
        <button type="button" id="search-clear" hidden aria-label="Clear search">×</button>
      </div>

      <button id="new-project-btn">+ Project</button>
    </nav>
    <div id="project-popover" class="popover" hidden>
      <div id="project-popover-list"></div>
      <div class="popover-form">
        <input type="text" id="new-project-name" placeholder="NAME">
        <input type="color" id="new-project-color" value="#E61919">
        <button id="project-popover-add">Add</button>
      </div>
    </div>
  </div>

  <div class="status-rail">
    <div id="sync-strip" class="sync-strip" data-status="no-file">Local only</div>

    <div id="reconnect-banner" class="banner alert" hidden>
      <span>File permission lost — your tasks are safe in the local mirror</span>
      <button id="reconnect-btn">Reconnect</button>
    </div>

    <div id="notif-banner" class="banner" hidden>
      <span>Enable notifications for due-time reminders</span>
      <button id="notif-enable-btn">Enable</button>
    </div>

    <div class="banner" id="no-file-banner">
      <span>Saved in this browser. Connect a file to sync it to disk.</span>
      <button id="connect-file-btn">Use existing file</button>
      <button id="new-file-btn">Create file</button>
    </div>
  </div>

  <div class="quick-add">
    <span class="quick-add-prefix">&gt;&gt;&gt;</span>
    <input type="text" id="quick-add-input" placeholder="ADD A TASK — PRESS ENTER, THEN FILL IN THE REST" autocomplete="off">
    <span class="quick-add-hint">N</span>
  </div>

  <main id="board" class="board">
    <section class="column" id="col-todo" data-status="todo">
      <header class="column-header">
        <span class="column-name">To do</span>
        <span class="column-count" id="count-todo">0</span>
      </header>
      <div class="column-body" id="body-todo"></div>
    </section>

    <section class="column" id="col-doing" data-status="doing">
      <header class="column-header">
        <span class="column-name">In progress</span>
        <span class="column-count" id="count-doing">0</span>
      </header>
      <div class="column-body" id="body-doing"></div>
    </section>

    <section class="column" id="col-done" data-status="done">
      <header class="column-header">
        <span class="column-name">Done</span>
        <span class="column-count" id="count-done">0</span>
      </header>
      <div class="column-body" id="body-done"></div>
    </section>
  </main>

  <div id="agenda-view" class="agenda-view" hidden>
    <div id="agenda-list" class="agenda-list"></div>
  </div>

  <div id="archive-view" class="archive-view" hidden>
    <div id="archive-list" class="archive-list"></div>
    <aside id="archive-rail" class="archive-rail"></aside>
  </div>

</div>

<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

<div id="card-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-label="Task detail">
  <div class="modal">
    <div class="modal-header">
      <span>Task / detail</span>
      <button id="card-modal-close" aria-label="Close">&times;</button>
    </div>
    <div id="card-modal-body" class="modal-body"></div>
  </div>
</div>

<div id="tour" class="tour" hidden role="dialog" aria-modal="true" aria-label="Guided tour">
  <div id="tour-spot" class="tour-spot"></div>
  <div id="tour-card" class="tour-card">
    <div class="tour-eyebrow" id="tour-step-label">GUIDE 01/08</div>
    <h2 class="tour-title" id="tour-title"></h2>
    <p class="tour-body" id="tour-body"></p>
    <div class="tour-actions">
      <button type="button" id="tour-skip" class="tour-skip">Skip tour</button>
      <div class="tour-nav">
        <button type="button" id="tour-back">Back</button>
        <button type="button" id="tour-next" class="btn-primary">Next</button>
      </div>
    </div>
  </div>
</div>

<script src="js/schema.js"></script>
<script src="js/storage.js"></script>
<script src="js/reminders.js"></script>
<script src="js/app.js"></script>
<script src="js/guide.js"></script>
</body>
</html>
